# Overrides only: the build sets buildUponDefaultConfig, so every rule not listed keeps detekt's default.
# Formatting belongs to spotless + ktlint (.editorconfig); detekt checks code, not layout.
# Opt-in guards below are light-mode rules: `detekt` (wired into `check`) runs without type resolution.
config:
  validation: true
  warningsAsErrors: true

complexity:
  # Size/complexity rules guard shipped code; samples and test DSL bodies are long by nature.
  excludes:
    - '**/examples/**'
    - '**/test/**'
    - '**/test-e2e/**'
    - '**/testFixtures/**'
  CognitiveComplexMethod:
    active: true
  LongParameterList:
    allowedFunctionParameters: 19
    allowedConstructorParameters: 19
  TooManyFunctions:
    allowedFunctionsPerFile: 29
    allowedFunctionsPerClass: 29
    allowedFunctionsPerInterface: 114
    allowedFunctionsPerObject: 14
    allowedFunctionsPerEnum: 14

coroutines:
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: false
  RedundantSuspendModifier:
    active: false

naming:
  ConstructorParameterNaming:
    active: false
  MatchingDeclarationName:
    active: false

exceptions:
  # Catch-all is the design at lifecycle/cleanup boundaries (rollback, addSuppressed, ensureActive); SwallowedException still guards.
  TooGenericExceptionCaught:
    active: false

performance:
  SpreadOperator:
    active: false
  UnnecessaryInitOnArray:
    active: true
  UnnecessaryTypeCasting:
    active: true

potential-bugs:
  UnconditionalJumpStatementInLoop:
    active: true

style:
  CollapsibleIfStatements:
    active: true
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 6
  ForbiddenComment:
    active: false
  MagicNumber:
    # Range bounds are protocol limits (HTTP status classes, ports, UTF-8 bytes); naming them adds nothing.
    ignoreRanges: true
    # HTTP status codes and 1 KiB read as themselves.
    ignoreNumbers: ['-1', '0', '1', '2', '200', '400', '404', '408', '429', '500', '1024']
    # Sample apps mirror RFC constants inline on purpose; libraries are still guarded.
    excludes:
      - '**/examples/**'
      - '**/test/**'
      - '**/test-e2e/**'
      - '**/testFixtures/**'
      - '**/domain/**'
      - '**/core/**'
      - '**/*.kts'
  MaxLineLength:
    maxLineLength: 140
    excludes:
      - '**/test/**'
      - '**/test-e2e/**'
      - '**/test-integration/**'
      - '**/testFixtures/**'
  ReturnCount:
    max: 5
  ThrowsCount:
    # Leading `if (...) throw` preconditions are not control flow.
    excludeGuardClauses: true
    excludes:
      - '**/examples/**'
  UnusedPrivateFunction:
    allowedNames: '_|ignored|expected|serialVersionUID'
  WildcardImport:
    active: false
