[package]
name = "stove-server"
version = "0.0.0"
edition = "2024"
description = "CLI for Stove — local observability dashboard for e2e test runs"

[lib]
name = "stove"
path = "src/lib.rs"

[[bin]]
name = "stove"
path = "src/main.rs"

[[test]]
name = "acceptance"
path = "acceptance-tests/cli_acceptance.rs"

[[test]]
name = "load"
path = "acceptance-tests/load.rs"

[features]
default = []
vendored-postgres = [
  "dep:openssl-sys",
  "dep:pq-sys",
  "openssl-sys/vendored",
  "pq-sys/bundled",
]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC server (receives events from Stove test process)
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# HTTP server (serves REST API + SPA to browser)
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.7", features = ["cors"] }
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

# SSE (live updates to browser)
tokio-stream = "0.1"

# Database
diesel = { version = "2.3", default-features = false, features = ["postgres", "sqlite", "serde_json", "returning_clauses_for_sqlite_3_35", "32-column-tables"] }
# Publishing enables `vendored-postgres` so release archives do not depend on
# a system-installed libpq/OpenSSL. Normal development builds stay fast.
pq-sys = { version = "0.7", default-features = false, optional = true }
openssl-sys = { version = "0.9", optional = true }
refinery = { version = "0.9", default-features = false, features = ["postgres", "rusqlite-bundled"] }
rusqlite = { version = "0.39", features = ["bundled"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
fallible-iterator = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
config-rs = { package = "config", version = "0.15", default-features = false, features = ["json", "toml"] }

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Embed SPA static files into binary
rust-embed = "8"
mime_guess = "2"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

# HTTP client (used for the Stove agent skills sync against GitHub)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "http2"] }

[dev-dependencies]
tempfile = "3"
testcontainers = "0.28"

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = "0.14"
