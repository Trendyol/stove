name: Set up Stove Server
description: Install the shared Node, Rust, native libraries, and SPA dependencies
inputs:
  targets:
    description: Additional Rust compilation targets
    required: false
    default: ''
  components:
    description: Additional Rust toolchain components
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: server/stove-server/spa/package-lock.json

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Install native build dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev libssl-dev pkg-config

    - name: Install native build dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install protobuf libpq
        echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"

    - name: Install SPA dependencies
      shell: bash
      working-directory: server/stove-server/spa
      run: npm ci
