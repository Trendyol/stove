name: Stove CLI Container Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version (for example 0.26.0; defaults to gradle.properties)'
        required: false
        type: string
      publish_latest:
        description: 'Also move latest (stable semantic versions only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: stove-cli-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: trendyol/stove-cli

jobs:
  prepare:
    name: Resolve image version and aliases
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
      major: ${{ steps.version.outputs.major }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      publish_latest: ${{ steps.version.outputs.publish_latest }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image version and aliases
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            raw_version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            raw_version="${INPUT_VERSION#v}"
          else
            raw_version="$(sed -n 's/^version=//p' gradle.properties)"
          fi

          if [[ ! "${raw_version}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid container version: ${raw_version}" >&2
            exit 1
          fi

          stable=false
          major=""
          major_minor=""
          if [[ "${raw_version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            stable=true
            major="${BASH_REMATCH[1]}"
            major_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          fi

          publish_latest=false
          if [[ "${stable}" == "true" ]] && \
             { [[ "${GITHUB_EVENT_NAME}" == "push" ]] || [[ "${INPUT_PUBLISH_LATEST}" == "true" ]]; }; then
            publish_latest=true
          fi

          {
            echo "version=${raw_version}"
            echo "stable=${stable}"
            echo "major=${major}"
            echo "major_minor=${major_minor}"
            echo "publish_latest=${publish_latest}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform.name }}
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux/amd64
            slug: amd64
            runner: ubuntu-latest
          # Apple Silicon / ARM support is disabled for now.
          # To re-enable, add (builds natively, no QEMU):
          # - name: linux/arm64
          #   slug: arm64
          #   runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.major_minor }},enable=${{ needs.prepare.outputs.stable }}
            type=raw,value=${{ needs.prepare.outputs.major }},enable=${{ needs.prepare.outputs.stable }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.publish_latest }}
          labels: |
            org.opencontainers.image.title=Stove CLI
            org.opencontainers.image.description=Dashboard, API, MCP server, and event ingestion for Stove test runs
            org.opencontainers.image.source=https://github.com/Trendyol/stove
            org.opencontainers.image.licenses=Apache-2.0

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      # Persist BuildKit cache mounts (cargo registry + target dir) across runs.
      # cache-from/cache-to: type=gha only caches image layers, NOT cache mounts,
      # so without this every run recompiles all dependencies from scratch.
      # Keyed by run_id so the cache is always re-saved (incremental progress
      # is kept); restore-keys falls back to the most recent entry.
      - name: Restore BuildKit cache mounts
        id: cache-mounts
        uses: actions/cache@v6
        with:
          path: cache-mount
          key: stove-cli-cargo-${{ matrix.platform.slug }}-${{ github.run_id }}
          restore-keys: stove-cli-cargo-${{ matrix.platform.slug }}-

      - name: Inject BuildKit cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: tools/stove-cli/Dockerfile
          skip-extraction: ${{ steps.cache-mounts.outputs.cache-hit }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/stove-cli/Dockerfile
          platforms: ${{ matrix.platform.name }}
          build-args: |
            STOVE_VERSION=${{ needs.prepare.outputs.version }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=stove-cli-image-${{ matrix.platform.slug }}
          cache-to: type=gha,mode=max,scope=stove-cli-image-${{ matrix.platform.slug }}
          # Attestations are disabled: with push-by-digest + manifest merge they
          # would be orphaned from the final manifest list.
          provenance: false
          sbom: false

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.platform.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests and push tags
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.major_minor }},enable=${{ needs.prepare.outputs.stable }}
            type=raw,value=${{ needs.prepare.outputs.major }},enable=${{ needs.prepare.outputs.stable }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.publish_latest }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s " *)

      - name: Inspect image
        shell: bash
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
