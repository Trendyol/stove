name: Stove Server Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave empty to read from gradle.properties)'
        required: false

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_VERSION" ]; then
              case "$INPUT_VERSION" in
                *[!A-Za-z0-9._-]*)
                  echo "Invalid version '${INPUT_VERSION}': only [A-Za-z0-9._-] allowed" >&2
                  exit 1
                  ;;
              esac
              VERSION="$INPUT_VERSION"
            else
              VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
            fi
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (tag: ${TAG})"

  build:
    needs: resolve-version
    uses: ./.github/workflows/stove-server-binaries.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  release:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.resolve-version.outputs.version }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true

      - name: Upload server binaries to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: "Stove v${{ needs.resolve-version.outputs.version }}"
          files: |
            stove-*.tar.gz
            stove-*.sha256
          fail_on_unmatched_files: false
          append_body: true
          body: |

            ---

            ### Stove Server Install

            **Homebrew (macOS):**
            ```
            brew install Trendyol/trendyol-tap/stove
            ```
            Already installed? Refresh the tap, then upgrade:
            ```
            brew update && brew upgrade stove
            ```

            **Shell script (macOS & Linux):**
            ```
            curl -fsSL https://raw.githubusercontent.com/Trendyol/stove/main/server/stove-server/install.sh | sh
            ```

            **Manual:** Download the archive for your platform below, extract, and place `stove` in your PATH.

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Generate and push Homebrew formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TAP_TOKEN: ${{ secrets.BOT_REPO_TOKEN }}
        run: |
          BASE_URL="https://github.com/Trendyol/stove/releases/download/v${VERSION}"

          CHECKSUM_DIR="$(mktemp -d)"
          trap 'rm -rf "$CHECKSUM_DIR"' EXIT
          for platform in darwin-arm64 darwin-amd64 linux-amd64; do
            archive="stove-${VERSION}-${platform}.tar.gz.sha256"
            curl -fsSL "${BASE_URL}/${archive}" -o "${CHECKSUM_DIR}/${archive}"
          done

          server/stove-server/scripts/publish-homebrew-formula.sh stove "$VERSION" "$CHECKSUM_DIR"
