name: Build

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'lib/**'
      - 'starters/**'
      - 'plugins/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'build-logic/**'
      - 'test-extensions/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.editorconfig'
      - 'detekt.yml'
      - '.github/workflows/build.yml'
      - 'justfile'
      - 'lefthook.yml'
      - 'mise.toml'
      - 'scripts/onboarding.py'
      - 'scripts/dev-env.sh'
      - 'scripts/tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - 'lib/**'
      - 'starters/**'
      - 'plugins/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'build-logic/**'
      - 'test-extensions/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.editorconfig'
      - 'detekt.yml'
      - '.github/workflows/build.yml'
      - 'justfile'
      - 'lefthook.yml'
      - 'mise.toml'
      - 'scripts/onboarding.py'
      - 'scripts/dev-env.sh'
      - 'scripts/tests/**'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      id-token: write
      issues: write
      pull-requests: write
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v3
        with:
          version: '2026.9.1'
          install: false
          env: false

      - name: Validate onboarding configuration
        run: mise tasks ls

      - uses: extractions/setup-just@v3
        with:
          just-version: '1.58.0'

      - name: Install Lefthook
        run: npm install --global lefthook@2.1.12

      - name: Test local commands and hook routing
        run: python3 -m unittest discover -s scripts/tests -v

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      # Run all tasks in a single Gradle invocation for optimal build time
      - name: Build, Test, and Coverage
        run: |
          ./gradlew build :koverXmlReport \
            --build-cache \
            --configuration-cache \
            --parallel \
            --no-daemon

      # Upload test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/build/test-results/
            **/build/reports/tests/
          retention-days: 7

      # Upload coverage to Codecov
      - name: Upload coverage to Codecov
        if: github.repository == 'Trendyol/stove'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Publish test report for PRs
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() && github.event_name == 'pull_request'
        with:
          report_paths: "**/build/test-results/**/*.xml"
          check_name: "Test Results"
          detailed_summary: true
          include_passed: false
