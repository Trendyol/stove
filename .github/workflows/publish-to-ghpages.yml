name: Publish MkDocs to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'hooks/**'
      - 'mkdocs.yml'
      - 'server/stove-server/spa/**'
      - 'gradle.properties'
      - 'requirements-docs.txt'
      - '.github/workflows/publish-to-ghpages.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'Trendyol/stove'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt

      - name: Install Dependencies
        run: pip install -r requirements-docs.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/stove-server/spa/package-lock.json

      - name: Build interactive dashboard demo
        working-directory: server/stove-server/spa
        run: |
          npm ci
          npm run build:demo

      - name: Build Site
        run: mkdocs build --strict

      - name: Include dashboard demo
        run: cp -R server/stove-server/spa/dist-demo site/dashboard-demo

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.BOT_REPO_TOKEN }}
          publish_dir: ./site
