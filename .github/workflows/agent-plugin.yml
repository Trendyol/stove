name: Agent Plugin

on:
  push:
    branches: [main]
    paths: ['.agents/**', '.claude-plugin/**', '.cursor-plugin/**', 'scripts/package-agent-plugin.py', 'scripts/tests/test_agent_plugin.py', 'gradle.properties', '.github/workflows/agent-plugin.yml', '.github/workflows/gradle-publish-release.yml']
  pull_request:
    paths: ['.agents/**', '.claude-plugin/**', '.cursor-plugin/**', 'scripts/package-agent-plugin.py', 'scripts/tests/test_agent_plugin.py', 'gradle.properties', '.github/workflows/agent-plugin.yml', '.github/workflows/gradle-publish-release.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Test version alignment and packaging
        run: python -m unittest discover -s scripts/tests -p test_agent_plugin.py -v
      - run: python -m pip install jsonschema
      - name: Validate portable manifests
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          import jsonschema
          for name in ('plugin.json', 'mcp.json'):
              document = json.loads((Path('.agents') / name).read_text())
              with urllib.request.urlopen(document['$schema'], timeout=30) as response:
                  schema = json.load(response)
              jsonschema.Draft202012Validator(schema).validate(document)
          PY
      - name: Package shared skill and adapters
        run: python scripts/package-agent-plugin.py --output "${{ runner.temp }}/stove-agent-plugin.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: stove-agent-plugin
          path: ${{ runner.temp }}/stove-agent-plugin.zip
