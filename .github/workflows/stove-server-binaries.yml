name: Build Stove Server Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and verify without publishing
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Version embedded in the SPA, binary, and archive names
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    timeout-minutes: 45
    env:
      STOVE_VERSION: ${{ inputs.version }}
      CARGO_INCREMENTAL: "0"
      # Keep the deployment baseline when upgrading the macOS build image.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners are required by the embedded Go/cgo profiler.
          - target: aarch64-apple-darwin
            runner: macos-26
            label: darwin-arm64
          - target: x86_64-unknown-linux-gnu
            # Preserve the standalone binary's glibc baseline.
            runner: ubuntu-24.04
            label: linux-amd64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: server/stove-server

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-stove-server
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/stove-server -> target
          shared-key: stove-binaries-${{ matrix.runner }}-${{ matrix.target }}
          env-vars: MACOSX_DEPLOYMENT_TARGET
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Server CI verifies generated API types. Packaging only bundles them,
      # avoiding a second Rust compilation just to run the type generator.
      - name: Build SPA from checked-in API types
        run: cd spa && npm run build:assets

      - name: Build release binary
        run: cargo build --release --locked --bin stove --features vendored-postgres --target ${{ matrix.target }}
        env:
          SKIP_SPA_BUILD: "1"

      - name: Verify standalone release binary
        run: |
          BINARY="target/${{ matrix.target }}/release/stove"
          ./scripts/verify-release-linkage.sh "$BINARY"
          test "$("$BINARY" --version)" = "stove ${STOVE_VERSION}"

      - name: Package tarball
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ARCHIVE="stove-${VERSION}-${{ matrix.label }}.tar.gz"
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/stove" staging/
          cp "${GITHUB_WORKSPACE}/LICENSE" staging/
          cp profiling-bridge/THIRD_PARTY_NOTICES staging/
          tar czf "${ARCHIVE}" -C staging .
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.label }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          path: |
            server/stove-server/stove-*.tar.gz
            server/stove-server/stove-*.sha256
