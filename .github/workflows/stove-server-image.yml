name: Stove Server Container Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version (for example 0.26.0; defaults to gradle.properties)'
        required: false
        type: string
      publish_latest:
        description: 'Also move latest (stable semantic versions only)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        description: 'Image version; snapshot versions also update the snapshot tag'
        required: true
        type: string
      publish_latest:
        description: 'Also move latest (stable semantic versions only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: stove-server-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: trendyol/stove-server

jobs:
  prepare:
    name: Resolve image version and aliases
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      metadata: ${{ steps.metadata.outputs.json }}
      labels: ${{ steps.metadata.outputs.labels }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image version and aliases
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            raw_version="${INPUT_VERSION#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            raw_version="${GITHUB_REF_NAME#v}"
          else
            raw_version="$(sed -n 's/^version=//p' gradle.properties)"
          fi

          if [[ ! "${raw_version}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid container version: ${raw_version}" >&2
            exit 1
          fi

          stable=false
          snapshot=false
          major=""
          major_minor=""
          if [[ "${raw_version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            stable=true
            major="${BASH_REMATCH[1]}"
            major_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          elif [[ "${raw_version}" =~ -[Ss][Nn][Aa][Pp][Ss][Hh][Oo][Tt]$ ]]; then
            snapshot=true
          fi

          publish_latest=false
          if [[ "${stable}" == "true" ]] && \
             { [[ "${GITHUB_EVENT_NAME}" == "push" ]] || [[ "${INPUT_PUBLISH_LATEST}" == "true" ]]; }; then
            publish_latest=true
          fi

          {
            echo "version=${raw_version}"
            echo "stable=${stable}"
            echo "snapshot=${snapshot}"
            echo "major=${major}"
            echo "major_minor=${major_minor}"
            echo "publish_latest=${publish_latest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.stable }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.stable }}
            type=raw,value=latest,enable=${{ steps.version.outputs.publish_latest }}
            type=raw,value=snapshot,enable=${{ steps.version.outputs.snapshot }}
          labels: |
            org.opencontainers.image.title=Stove Server
            org.opencontainers.image.description=Dashboard, API, MCP server, and event ingestion for Stove test runs
            org.opencontainers.image.source=https://github.com/Trendyol/stove
            org.opencontainers.image.licenses=Apache-2.0

  build:
    name: Build ${{ matrix.platform.name }}
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux/amd64
            slug: amd64
            # glibc 2.35 binaries run on Bookworm's glibc 2.36. Do not
            # switch to ubuntu-latest without checking runtime compatibility.
            runner: ubuntu-22.04
          # ARM remains disabled. Its native builder must also use a libc
          # no newer than the Debian Bookworm runtime.
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-stove-server

      # The action keys dependency artifacts by toolchain, Cargo inputs, and
      # build environment, with fallback restoration. Main seeds release caches.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/stove-server -> target
          shared-key: stove-image-ubuntu22-${{ matrix.platform.slug }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build SPA from checked-in API types
        working-directory: server/stove-server/spa
        env:
          STOVE_VERSION: ${{ needs.prepare.outputs.version }}
        # stove-server-ci.yml checks that generated types match the Rust API.
        # Packaging must not compile a second, debug Rust dependency graph.
        run: npm run build:assets

      - name: Build release binary
        working-directory: server/stove-server
        env:
          STOVE_VERSION: ${{ needs.prepare.outputs.version }}
          SKIP_SPA_BUILD: "1"
        run: cargo build --locked --release --bin stove

      - name: Prepare runtime image context
        run: |
          mkdir -p "${{ runner.temp }}/stove-image"
          install -m 755 server/stove-server/target/release/stove "${{ runner.temp }}/stove-image/stove"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/stove-image
          file: server/stove-server/Dockerfile
          platforms: ${{ matrix.platform.name }}
          build-args: |
            BINARY_SOURCE=prebuilt-binary
          labels: ${{ needs.prepare.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=stove-server-runtime-${{ matrix.platform.slug }}
          cache-to: type=gha,mode=min,scope=stove-server-runtime-${{ matrix.platform.slug }}
          # Attestations are disabled: with push-by-digest + manifest merge they
          # would be orphaned from the final manifest list.
          provenance: false
          sbom: false

      # Validate the exact image digest before the merge job publishes tags.
      - name: Verify runtime image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: server/stove-server/scripts/verify-image.sh "$IMAGE" "$VERSION"

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.platform.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests and push tags
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ needs.prepare.outputs.metadata }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          for digest in *; do
            args+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        shell: bash
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
