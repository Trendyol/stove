name: Build Process Recipes

on:
  push:
    branches: [main]
    paths:
      - 'recipes/process/**'
      - 'go/stove-profiler/**'
      - 'lib/stove-dashboard/**'
      - 'starters/container/stove-container/**'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/build-process-recipes.yml'
  pull_request:
    branches: [main]
    paths:
      - 'recipes/process/**'
      - 'go/stove-profiler/**'
      - 'lib/stove-dashboard/**'
      - 'starters/container/stove-container/**'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/build-process-recipes.yml'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-showcase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: echo "STOVE_JDK17=$JAVA_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: echo "STOVE_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-go@v7
        with:
          go-version-file: recipes/process/golang/go-showcase/go.mod
          cache-dependency-path: recipes/process/golang/go-showcase/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Let same-repository PRs reuse their own cache; fork PRs stay read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Publish matching Stove APIs locally
        run: |
          ./gradlew --no-daemon \
            :lib:stove-bom:publishToMavenLocal :lib:stove:publishToMavenLocal \
            :lib:stove-dashboard:publishToMavenLocal :lib:stove-dashboard-api:publishToMavenLocal \
            :lib:stove-http:publishToMavenLocal :lib:stove-kafka:publishToMavenLocal \
            :lib:stove-postgres:publishToMavenLocal :lib:stove-rdbms:publishToMavenLocal \
            :lib:stove-tracing:publishToMavenLocal :starters:process:stove-process:publishToMavenLocal \
            :starters:container:stove-container:publishToMavenLocal \
            :test-extensions:stove-extensions-kotest:publishToMavenLocal

      - name: Run process and container E2E tests
        env:
          GOTOOLCHAIN: auto
        run: |
          GO_EXECUTABLE="$(command -v go)"
          export GO_EXECUTABLE
          "$GO_EXECUTABLE" version
          stove_recipe_version="$(awk -F= '/^version=/{print $2; exit}' gradle.properties)"
          ./recipes/process/golang/go-showcase/gradlew -p recipes/process/golang/go-showcase \
            e2eTest e2eTest-container -PuseMavenLocal=true -PstoveVersion="$stove_recipe_version" --build-cache --no-daemon

      # Upload test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: process-recipes-test-results
          path: |
            recipes/process/**/build/test-results/
            recipes/process/**/build/reports/tests/
          retention-days: 7

      # Publish test report for PRs
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() && github.event_name == 'pull_request'
        with:
          report_paths: "recipes/process/**/build/test-results/**/*.xml"
          check_name: "Process Recipes Test Results"
          detailed_summary: true
          include_passed: false
