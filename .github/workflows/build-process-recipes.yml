name: Build Process Recipes

on:
  push:
    branches: [main]
    paths:
      - 'recipes/process/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/build-process-recipes.yml'
  pull_request:
    branches: [main]
    paths:
      - 'recipes/process/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/build-process-recipes.yml'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-showcase:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@v7
        with:
          go-version-file: recipes/process/golang/go-showcase/go.mod

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      # Cache Docker images for testcontainers
      - name: Cache Docker images
        uses: actions/cache@v6
        with:
          path: /var/lib/docker
          key: docker-process-recipes-${{ runner.os }}
          restore-keys: |
            docker-process-recipes-${{ runner.os }}-

      - name: Run E2E Tests (all Kafka libraries)
        env:
          GOTOOLCHAIN: auto
        run: |
          GO_EXECUTABLE="$(command -v go)"
          export GO_EXECUTABLE
          "$GO_EXECUTABLE" version
          ./gradlew -p recipes/process/golang/go-showcase e2eTest \
            --build-cache \
            --no-daemon

      - name: Run Container E2E Tests (sarama)
        env:
          GOTOOLCHAIN: auto
        run: |
          GO_EXECUTABLE="$(command -v go)"
          export GO_EXECUTABLE
          "$GO_EXECUTABLE" version
          ./gradlew -p recipes/process/golang/go-showcase e2eTest-container \
            --build-cache \
            --no-daemon && \
          ./gradlew -p recipes/process/golang/go-showcase removeContainerImage \
            --no-daemon

      # Upload test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: process-recipes-test-results
          path: |
            recipes/process/**/build/test-results/
            recipes/process/**/build/reports/tests/
          retention-days: 7

      # Publish test report for PRs
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() && github.event_name == 'pull_request'
        with:
          report_paths: "recipes/process/**/build/test-results/**/*.xml"
          check_name: "Process Recipes Test Results"
          detailed_summary: true
          include_passed: false
