name: Build Process Recipes

on:
  push:
    branches: [main]
    paths:
      - 'recipes/process/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/build-process-recipes.yml'
  pull_request:
    branches: [main]
    paths:
      - 'recipes/process/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/build-process-recipes.yml'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-showcase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@v7
        with:
          go-version-file: recipes/process/golang/go-showcase/go.mod
          cache-dependency-path: recipes/process/golang/go-showcase/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Run process and container E2E tests
        env:
          GOTOOLCHAIN: auto
        run: |
          GO_EXECUTABLE="$(command -v go)"
          export GO_EXECUTABLE
          "$GO_EXECUTABLE" version
          ./recipes/process/golang/go-showcase/gradlew -p recipes/process/golang/go-showcase \
            e2eTest e2eTest-container --build-cache --no-daemon

      # Upload test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: process-recipes-test-results
          path: |
            recipes/process/**/build/test-results/
            recipes/process/**/build/reports/tests/
          retention-days: 7

      # Publish test report for PRs
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() && github.event_name == 'pull_request'
        with:
          report_paths: "recipes/process/**/build/test-results/**/*.xml"
          check_name: "Process Recipes Test Results"
          detailed_summary: true
          include_passed: false
