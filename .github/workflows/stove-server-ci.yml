name: Stove Server CI

on:
  push:
    branches: [main]
    paths:
      - 'server/stove-server/**'
      - 'lib/stove-dashboard-api/src/main/proto/**'
      - 'gradle.properties'
      - '.github/workflows/stove-server-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/stove-server/**'
      - 'lib/stove-dashboard-api/src/main/proto/**'
      - 'gradle.properties'
      - '.github/workflows/stove-server-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SKIP_SPA_BUILD: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: server/stove-server

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: server/stove-server/spa/package-lock.json

      - name: Install SPA dependencies
        run: cd spa && npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpq-dev libssl-dev pkg-config

      # Key dependency artifacts by the Rust toolchain and Cargo inputs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/stove-server -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check generated REST types
        run: cd spa && npm run check:api

      - name: SPA lint and format check
        run: cd spa && npm run check

      - name: SPA tests
        run: cd spa && npm test

      - name: Build SPA
        run: cd spa && npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked --lib --test api_e2e --test mcp_e2e

      - name: Run server acceptance tests
        run: cargo test --locked --test acceptance

      - name: Run PostgreSQL load test
        run: cargo test --locked --test load -- --nocapture
