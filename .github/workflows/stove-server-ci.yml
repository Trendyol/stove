name: Stove Server CI

on:
  push:
    branches: [main]
    paths:
      - 'server/stove-server/**'
      - 'lib/stove-dashboard-api/src/main/proto/**'
  pull_request:
    branches: [main]
    paths:
      - 'server/stove-server/**'
      - 'lib/stove-dashboard-api/src/main/proto/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/stove-server

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: server/stove-server/spa/package-lock.json

      - name: Install SPA dependencies
        run: cd spa && npm ci

      - name: SPA lint and format check
        run: cd spa && npx biome check src

      - name: Build SPA
        run: cd spa && npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/stove-server/target
          key: cargo-${{ runner.os }}-${{ hashFiles('server/stove-server/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings
        env:
          SKIP_SPA_BUILD: "1"

      - name: Run tests
        run: cargo test --lib --test api_e2e --test mcp_e2e
        env:
          SKIP_SPA_BUILD: "1"

      - name: Run server acceptance tests
        run: cargo test --test acceptance
        env:
          SKIP_SPA_BUILD: "1"

      - name: Run PostgreSQL load test
        run: cargo test --test load -- --nocapture
        env:
          SKIP_SPA_BUILD: "1"
