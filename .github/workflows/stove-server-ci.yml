name: Stove Server CI

on:
  push:
    branches: [main]
    paths:
      - 'server/stove-server/**'
      - 'lib/stove-dashboard-api/src/main/proto/**'
      - 'gradle.properties'
      - '.github/workflows/stove-server-ci.yml'
      - '.github/actions/setup-stove-server/**'
  pull_request:
    branches: [main]
    paths:
      - 'server/stove-server/**'
      - 'lib/stove-dashboard-api/src/main/proto/**'
      - 'gradle.properties'
      - '.github/workflows/stove-server-ci.yml'
      - '.github/actions/setup-stove-server/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SKIP_SPA_BUILD: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: server/stove-server

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-stove-server
        with:
          components: clippy, rustfmt

      # Key dependency artifacts by the Rust toolchain and Cargo inputs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/stove-server -> target
          shared-key: stove-ci-ubuntu24
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check generated REST types
        run: cd spa && npm run check:api

      - name: SPA lint and format check
        run: cd spa && npm run check

      - name: SPA tests
        run: cd spa && npm test

      - name: Build SPA
        run: cd spa && npm run build:assets

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked --lib --test api_e2e --test mcp_e2e --test top_filter

      - name: Run server acceptance tests
        run: cargo test --locked --test acceptance

      - name: Run PostgreSQL load test
        run: cargo test --locked --test load -- --nocapture
