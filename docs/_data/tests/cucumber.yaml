label: Cucumber / Gherkin
gradle:
  - com.trendyol:stove-extensions-cucumber
  - io.cucumber:cucumber-junit-platform-engine:8.0.4
  - org.junit.platform:junit-platform-suite:6.1.3
  - io.kotest:kotest-assertions-core:6.2.6
runtimeGradle:
  - org.junit.platform:junit-platform-launcher:6.1.3
  - com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.23.0
classImport: com.trendyol.stove.extensions.cucumber.StoveSteps
sample: |-
  class SampleSteps : StoveSteps({
    Then("the selected systems satisfy the expected state") {
  {body}
    }
  })
suite: |-
  package {pkg}.e2e

  import org.junit.platform.suite.api.IncludeEngines
  import org.junit.platform.suite.api.SelectPackages
  import org.junit.platform.suite.api.Suite

  @Suite
  @IncludeEngines("cucumber")
  @SelectPackages("features")
  class CucumberSuite
properties: |-
  cucumber.glue={pkg}.e2e,com.trendyol.stove.extensions.cucumber
  cucumber.glue.hint.enabled=false
  cucumber.plugin=com.trendyol.stove.extensions.cucumber.StoveCucumberPlugin
  cucumber.execution.parallel.enabled=true
  cucumber.execution.parallel.config.strategy=fixed
  cucumber.execution.parallel.config.fixed.parallelism=4
  cucumber.execution.parallel.config.fixed.max-pool-size=4
feature: |-
  Feature: Application integration
    Scenario: End-to-end flow
      Then the selected systems satisfy the expected state
gradleSetup: |-
  val e2eSourceSet = sourceSets.create("test-e2e") {
      compileClasspath += sourceSets.main.get().output
      runtimeClasspath += sourceSets.main.get().output
  }
  configurations[e2eSourceSet.implementationConfigurationName]
      .extendsFrom(configurations.testImplementation.get())
  configurations[e2eSourceSet.runtimeOnlyConfigurationName]
      .extendsFrom(configurations.testRuntimeOnly.get())

  tasks.register<Test>("e2eTest") {
      testClassesDirs = e2eSourceSet.output.classesDirs
      classpath = e2eSourceSet.runtimeClasspath
      // The suite delegates feature discovery to Cucumber exactly once.
      useJUnitPlatform { includeEngines("junit-platform-suite") }
  }
