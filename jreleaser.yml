project:
  name: stove
  description: The easiest way of e2e testing in Kotlin
  license: Apache-2.0
  links:
    homepage: https://github.com/Trendyol/stove
    documentation: https://trendyol.github.io/stove/
    bugTracker: https://github.com/Trendyol/stove/issues
  authors:
    - Oguzhan Soykan
  inceptionYear: "2022"

release:
  github:
    owner: Trendyol
    name: stove
    tagName: "v{{projectVersion}}"
    releaseName: "Stove v{{projectVersion}}"
    overwrite: false
    skipTag: false
    changelog:
      enabled: true
      formatted: ALWAYS
      preset: conventional-commits
      content: |
        # Changelog

        Read the [release notes and migration guides](https://trendyol.github.io/stove/release-notes/) on the Stove documentation site.

        {{changelogChanges}}
        {{changelogContributors}}
      contributors:
        enabled: false
      hide:
        categories:
          - merge
        contributors:
          - "[bot]"
          - "GitHub"
